# Default benchmark configuration. Every experiment reads its own section.
# Override any value from the CLI:  --set matmul.iterations=5 --set sustained.duration_minutes=2
seed: 1234
results_dir: results

numerics:
  # Strict FP32 everywhere: TF32 would make CUDA "FP32" matmuls/convs faster but
  # numerically different from CPU/MPS FP32. Flip to true to study TF32 explicitly.
  allow_tf32: false

matmul:
  sizes: [1024, 2048, 4096, 8192]
  dtype: float32
  warmup: 5
  iterations: 30
  # Heavy sizes get fewer iterations so the CPU backend finishes in reasonable time.
  overrides_by_size:
    1024: {warmup: 20, iterations: 100}   # small sizes are noisy (clock ramp-up, launch overhead)
    2048: {warmup: 10, iterations: 50}
    8192: {warmup: 2, iterations: 10}
  verify_max_size: 2048      # compare result against CPU FP32 for sizes <= this

cnn:
  model: resnet18_cifar
  dataset: cifar10
  data_dir: data
  train_samples: 4096        # fixed seeded subset (CPU is ~15x slower than MPS here); null = full 50k set
  val_samples: 1000          # fixed seeded subset of the 10k test set; null = all
  batch_sizes: [16, 32, 64, 128]
  epochs: 3
  optimizer: sgd
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  val_batch_size: 256
  augmentation: {random_crop_padding: 4, horizontal_flip: true}

transformer:
  model: {vocab_size: 4096, d_model: 256, n_layers: 4, n_heads: 4, mlp_ratio: 4}
  batch_sizes: [8, 16, 32]
  sequence_lengths: [128, 256, 512]
  warmup_steps: 3
  steps: 20
  lr: 0.0003
  data: {num_sequences: 2048, branching: 4}   # synthetic learnable token stream

memory:
  timeout_s: 240             # per configuration (each runs in a fresh subprocess)
  warmup_steps: 1
  steps: 2
  cpu_rss_cap_fraction: 0.6  # safety cap: kill a CPU worker above this share of system RAM
  mps_memory_fraction: 0.9   # safety cap: share of MPS recommended max working set
  base_model: small
  base_batch_size: 8
  base_sequence_length: 256
  models:
    tiny:   {d_model: 128,  n_layers: 2,  n_heads: 4}
    small:  {d_model: 256,  n_layers: 4,  n_heads: 4}
    medium: {d_model: 512,  n_layers: 8,  n_heads: 8}
    large:  {d_model: 768,  n_layers: 12, n_heads: 12}
    xl:     {d_model: 1024, n_layers: 16, n_heads: 16}
  vocab_size: 4096
  ladders:
    batch_size: [8, 16, 32, 64, 128, 256, 512, 1024]
    sequence_length: [128, 256, 512, 1024, 2048, 4096]
    model: [tiny, small, medium, large, xl]

precision:
  precisions: [fp32, fp16, bf16]
  # time_budget_s: if the first call shows a configuration would take longer than this, warmup is cut to 1 and
  # iterations to >= 3 (flagged as reduced_for_time_budget). Needed because CPU half precision is ~600x slower than FP32.
  matmul: {size: 4096, warmup: 3, iterations: 15, time_budget_s: 60}
  transformer: {batch_size: 16, sequence_length: 256, warmup_steps: 2, steps: 10, time_budget_s: 120}

rl:
  env: CartPole-v1
  num_envs: 8
  rollout_steps: 128
  ppo_iterations: 30
  update_epochs: 4
  minibatch_size: 256
  hidden_sizes: [64, 512]    # policy MLP widths compared (tiny net vs. wider net)
  lr: 0.00025
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5

sustained:
  duration_minutes: 30
  log_interval_s: 10
  batch_size: 16
  sequence_length: 256
  lr: 0.0003
  model: {vocab_size: 4096, d_model: 256, n_layers: 4, n_heads: 4, mlp_ratio: 4}
